<div class="inline-flex items-center gap-3 {{className()}}">
    <logomark [size]="size()" />
    <div class="flex flex-col leading-none">
        <span class="{{word}} font-extrabold tracking-tight" [style]="{fontSize: (size() * 0.72 + 'px'), lineHeight: 1 }">
            Texter
        </span>
        @if (showTagline()) {
            <span class="{{tag}} mt-1 font-semibold uppercase" [style]="{fontSize: Math.max(9, size() * 0.22) + 'px', letterSpacing: '0.32em'}">
                by Kfyklab
            </span>
        }
    </div>
</div>
